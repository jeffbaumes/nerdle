<html>
  <style>
    body {
      font-family: monospace;
      font-size: 16px;
      text-transform: uppercase;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    #title {
      display: grid;
      place-items: center;
      font-size: 24px;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(5, 50px);
      grid-template-rows: repeat(6, 50px);
      gap: 4px;
      min-width: none;
    }
    #grid > div {
      border: 1px black solid;
      transform-style: preserve-3d;
    }
    #grid .front,
    #grid .back {
      background-color: white;
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: grid;
      place-items: center;
      font-size: 32px;
    }
    #grid .back {
      transform: rotateY(180deg);
    }
    #grid .gray {
      background-color: gray;
    }
    #grid .green {
      background-color: green;
    }
    #grid .yellow {
      background-color: yellow;
    }
    #grid .flip {
      transform: rotateY(180deg);
    }
    .action {
      border: 1px black solid;
      height: 50px;
      width: 104px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .action:hover {
      background-color: gray;
    }
    .hidden {
      display: none;
    }
  </style>
  <body>
    <div class="container">
      <div id="title">Title</div>
      <div id="grid"></div>
      <div id="next" class="action hidden">Next</div>
      <div id="restart" class="action hidden">Restart</div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
